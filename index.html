<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Sector Data Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafbfc;--card:#fff;--line:#e8ebf0;--line2:#d7dde6;
  --ink:#1f2937;--muted:#6b7280;--faint:#9ca3af;
  --accent:#2563eb;--accentT:#eff4ff;--ok:#16a34a;--bad:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
a{color:inherit;text-decoration:none}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}

/* Header */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hd{display:flex;align-items:center;gap:14px;height:60px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accentT);display:grid;place-items:center;flex:none}
.hd h1{margin:0;font-size:16px;font-weight:600;white-space:nowrap}
.search{flex:1;max-width:520px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search:focus-within{border-color:var(--accent);background:#fff}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;padding:9px 0;color:var(--ink)}
.search kbd{font:inherit;font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.note{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.note i{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* Filters */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0 18px}
.chip{border:1px solid var(--line);background:#fff;font:inherit;font-size:13.5px;color:var(--muted);padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{background:var(--accentT);border-color:#c9dafb;color:var(--accent);font-weight:500}
.chip .n{color:var(--faint);margin-left:4px}
.chip.on .n{color:#7aa0ef}
.copyall{margin-left:auto;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:6px 4px}
.copyall:hover{color:var(--accent)}

/* Quick links */
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.quick span.l{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;align-self:center;margin-right:4px}
.qa{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 10px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.qa:hover{border-color:var(--accent);color:var(--accent)}
.qa svg{color:var(--faint)}

/* Groups */
.group{margin-bottom:28px}
.group h2{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;min-width:0;transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.ct{display:flex;align-items:flex-start;gap:12px}
.mono{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.ttl{min-width:0;flex:1}
.ttl a.name{font-size:15px;font-weight:600;line-height:1.3;display:block}
.ttl a.name:hover{color:var(--accent)}
.ttl .host{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-top:2px}
.ttl .host i{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.area{margin-left:auto;font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 8px;white-space:nowrap}
.desc{font-size:13.5px;color:var(--muted);margin:10px 0 12px}
.links{margin-top:auto;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column}
.lr{display:flex;align-items:center;gap:8px;padding:5px 6px;margin:0 -6px;border-radius:7px}
.lr:hover{background:var(--bg)}
.lr a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13.5px}
.lr a span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr a:hover span.t{color:var(--accent)}
.fmt{font-size:10px;font-weight:600;letter-spacing:.03em;width:30px;text-align:center;padding:1px 0;border-radius:4px;flex:none;color:var(--muted);background:#f1f3f6}
.fmt.xls{color:#15803d;background:#ecf8f0}.fmt.pdf{color:#b91c1c;background:#fdf0f0}
.cp{border:0;background:none;color:var(--faint);width:24px;height:24px;border-radius:6px;cursor:pointer;display:grid;place-items:center;flex:none;opacity:0;transition:opacity .15s}
.lr:hover .cp,.cp:focus-visible{opacity:1}
.cp:hover{color:var(--accent);background:var(--accentT)}
@media (hover:none){.cp{opacity:1}}

/* Not working */
details{border-top:1px solid var(--line);margin-top:8px;padding:14px 0 30px}
summary{cursor:pointer;font-size:13.5px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary .a{transition:transform .15s;font-size:10px}
details[open] summary .a{transform:rotate(90deg)}
.dl{margin-top:12px;display:grid;gap:6px}
.dr{display:flex;gap:10px;align-items:baseline;font-size:13.5px;flex-wrap:wrap}
.dr i{width:6px;height:6px;border-radius:50%;background:var(--bad);display:inline-block;flex:none;transform:translateY(-1px)}
.dr b{font-weight:500}
.dr span{color:var(--faint)}
.dr em{font-style:normal;color:var(--muted)}

.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:12px;background:#fff}
mark{background:#fff3c4;color:inherit;border-radius:2px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,12px);background:var(--ink);color:#fff;font-size:13.5px;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:720px){
  .wrap{padding:0 16px}
  .hd{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none;margin:0}
  .note{display:none}
  .bar{flex-wrap:nowrap;overflow-x:auto;margin:16px -16px 14px;padding:0 16px}
  .copyall{display:none}
  .quick{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 22px;padding:0 16px 2px}
  .qa{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div class="logo" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="#2563eb"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></div>
    <h1>Power Sector Data Hub</h1>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search portals and reports" aria-label="Search"><kbd>/</kbd></label>
    <span class="note"><i></i>Checked 19 Nov 2026</span>
  </div>
</header>

<main class="wrap">
  <div class="bar" id="bar"></div>
  <div class="quick" id="quick"></div>
  <div id="list"></div>
  <details id="down"></details>
</main>
<div class="toast" id="toast"></div>

<script>
const AREAS={dist:"Distribution",grid:"Grid & generation",mkt:"Market & payments",pol:"Policy & research"};
const PORTALS=[
 {cat:"dist",ab:"RDSS",name:"RDSS – Revamped Distribution Sector Scheme",host:"rdss.powermin.gov.in",
  desc:"AT&C loss, ACS–ARR gap, funds sanctioned and released, smart metering – DISCOM-wise.",
  main:"https://rdss.powermin.gov.in/dashboard",
  links:[["RDSS dashboard","https://rdss.powermin.gov.in/dashboard","WEB"],["Consumer service rating","https://rdss.powermin.gov.in/csrd","WEB"],["Scheme home & press releases","https://rdss.powermin.gov.in/","WEB"]]},
 {cat:"grid",ab:"NPP",name:"National Power Portal (CEA)",host:"npp.gov.in",
  desc:"Installed capacity, daily generation by fuel, transmission and daily coal stock.",
  main:"https://npp.gov.in/publishedReports",
  links:[["Published reports – daily, monthly, fuel","https://npp.gov.in/publishedReports","XLS"],["Capacity dashboard","https://npp.gov.in/dashBoard/cp-map-dashboard","WEB"],["Generation & coal dashboard","https://npp.gov.in/dashBoard/gc-map-dashboard","WEB"],["Transmission dashboard","https://npp.gov.in/dashBoard/trans-map-dashboard","WEB"]]},
 {cat:"grid",ab:"NLDC",name:"Grid-India – Daily Power Supply Position",host:"grid-india.in",
  desc:"Daily all-India peak demand met, shortage, state-wise energy, frequency and RE generation.",
  main:"https://grid-india.in/en/reports/daily-psp-report",
  links:[["All daily PSP reports","https://grid-india.in/en/reports/daily-psp-report","WEB"],["PSP 17 Nov 2026","https://webcdn.grid-india.in/files/grdw/2026/11/17.11.26_NLDC_PSP_634.xls","XLS"],["PSP 17 Nov 2026","https://webcdn.grid-india.in/files/grdw/2026/11/17.11.26_NLDC_PSP_876.pdf","PDF"]]},
 {cat:"mkt",ab:"PRA",name:"PRAAPTI – Payment Tracking",host:"praapti.in",
  desc:"Generator invoices and DISCOM payments under LPS Rules 2022; overdue by DISCOM.",
  main:"https://praapti.in/",
  links:[["PRAAPTI portal","https://praapti.in/","WEB"]]},
 {cat:"mkt",ab:"IEX",name:"IEX – Market Data",host:"iexindia.com",
  desc:"15-minute bids, cleared volume and clearing price for DAM, RTM and GDAM.",
  main:"https://www.iexindia.com/market-data/real-time-market/market-snapshot",
  links:[["Day-ahead market (DAM)","https://www.iexindia.com/market-data/day-ahead-market/market-snapshot","WEB"],["Real-time market (RTM)","https://www.iexindia.com/market-data/real-time-market/market-snapshot","WEB"],["Green day-ahead market (GDAM)","https://www.iexindia.com/market-data/green-day-ahead-market/market-snapshot","WEB"]]},
 {cat:"pol",ab:"ICED",name:"NITI Aayog – India Climate & Energy Dashboard",host:"iced.niti.gov.in",
  desc:"Energy supply, consumption, capacity and emissions; Excel download on each chart.",
  main:"https://iced.niti.gov.in/",
  links:[["ICED home","https://iced.niti.gov.in/","XLS"]]},
 {cat:"pol",ab:"PEG",name:"Prayas Energy – Data Portals",host:"energy.prayaspune.org",
  desc:"Public data on renewable energy and transmission, with analysis.",
  main:"https://energy.prayaspune.org/",
  links:[["Renewable energy data portal","https://energy.prayaspune.org/renewable-energy-data-portal","WEB"],["India Transmission Portal","https://indiatransmission.org/","WEB"],["Prayas Energy home","https://energy.prayaspune.org/","WEB"]]}
];
const QUICK=[["RDSS dashboard","https://rdss.powermin.gov.in/dashboard"],["Latest PSP (Excel)","https://webcdn.grid-india.in/files/grdw/2026/11/17.11.26_NLDC_PSP_634.xls"],["NPP daily reports","https://npp.gov.in/publishedReports"],["IEX real-time prices","https://www.iexindia.com/market-data/real-time-market/market-snapshot"],["PRAAPTI overdue","https://praapti.in/"]];
const DOWN=[["NFMS","nfms.powermin.gov.in","asks for sign-in; figures blank"],["NSGM","nsgm.gov.in","site not reachable"],["MERIT India","meritindia.in","server closes the connection"],["PUShP","pushp.powermin.gov.in","address does not exist – open from the Apps menu on npp.gov.in"]];

let area="all",q="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl=s=>{s=esc(s);if(!q)return s;q.split(/\s+/).filter(Boolean).forEach(w=>{s=s.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")});return s};
const cpIc='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const arIc='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const txt=p=>(p.name+" "+p.host+" "+p.desc+" "+AREAS[p.cat]+" "+p.links.map(l=>l[0]+" "+l[2]).join(" ")).toLowerCase();
const ok=p=>(area==="all"||p.cat===area)&&(!q||q.split(/\s+/).every(w=>txt(p).includes(w)));

function bar(){
  const items=[["all","All",PORTALS.length],...Object.entries(AREAS).map(([k,n])=>[k,n,PORTALS.filter(p=>p.cat===k).length])];
  document.getElementById("bar").innerHTML=items.map(([k,n,c])=>`<button class="chip ${k===area?"on":""}" data-a="${k}">${n}<span class="n">${c}</span></button>`).join("")+
    `<button class="copyall" id="copyAll">${cpIc} Copy all links</button>`;
}
function list(){
  let h="";
  const ps=PORTALS.filter(ok);
  if(ps.length){
    h=`<div class="grid">${ps.map(p=>`
      <article class="card">
        <div class="ct"><div class="mono">${p.ab}</div>
          <div class="ttl"><a class="name" href="${p.main}" target="_blank" rel="noopener">${hl(p.name)}</a>
          <div class="host"><i title="Working"></i>${p.host}<span class="area">${AREAS[p.cat]}</span></div></div></div>
        <p class="desc">${hl(p.desc)}</p>
        <div class="links">${p.links.map(([t,u,f])=>`<div class="lr"><a href="${u}" target="_blank" rel="noopener"><span class="fmt ${f.toLowerCase()}">${f}</span><span class="t">${hl(t)}</span></a><button class="cp" data-u="${u}" aria-label="Copy link" title="Copy link">${cpIc}</button></div>`).join("")}</div>
      </article>`).join("")}</div>`;
  }
  document.getElementById("list").innerHTML=h||`<div class="empty">Nothing found for “${esc(q)}”.</div>`;
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1600)}
async function copy(t,m){try{await navigator.clipboard.writeText(t);toast(m)}catch(e){toast("Copy not allowed here")}}

document.getElementById("quick").innerHTML=`<span class="l">Quick</span>`+QUICK.map(([n,u])=>`<a class="qa" href="${u}" target="_blank" rel="noopener">${n}${arIc}</a>`).join("");
document.getElementById("down").innerHTML=`<summary><span class="a">▶</span>${DOWN.length} portals not working at last check</summary><div class="dl">${DOWN.map(([n,h,w])=>`<div class="dr"><i></i><b>${n}</b><span>${h}</span><em>– ${w}</em></div>`).join("")}</div>`;
document.getElementById("bar").addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(c){area=c.dataset.a;bar();list();return}
  if(e.target.closest("#copyAll"))copy(PORTALS.map(p=>p.name+"\n"+p.links.map(l=>"  "+l[0]+" ("+l[2]+"): "+l[1]).join("\n")).join("\n\n"),"All links copied");
});
document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest(".cp");if(b)copy(b.dataset.u,"Link copied")});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();list()});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();document.getElementById("q").focus()}if(e.key==="Escape"&&document.activeElement.id==="q"){e.target.value="";q="";list()}});
bar();list();
</script>
</body>
</html>
